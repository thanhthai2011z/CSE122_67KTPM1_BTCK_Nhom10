  <h2>Quản lý Khu vực (Zone View)</h2>
  <div id="zone-list"></div>

  <script src="data.js"></script>
  <script>
    function renderZones() {
      const zones = getItems('zones');
      const container = document.getElementById('zone-list');
      container.innerHTML = zones.map(z => `
        <div class="zone-card status-${z.status}">
          <h3>${z.name}</h3>
          <p>Trạng thái: <strong>${z.status === 'Xanh' ? 'Đủ hàng' : 'Cần bổ sung'}</strong></p>
        </div>
      `).join('');
    }
    renderZones();
  </script>
</body>
</html>
