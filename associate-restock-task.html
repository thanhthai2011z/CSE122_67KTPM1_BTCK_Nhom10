<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bổ sung Hàng & AI Priority</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <a href="associate-zone-view.html">🏢 Xem Khu Vực</a>
    <a href="associate-shelf-check.html">📝 Kiểm Kệ</a>
    <a href="associate-restock-task.html">⚡ Nhiệm Vụ & AI</a>
    <a href="profile.html">👤 Cá Nhân</a>
    <a href="notifications.html">🔔 Thông Báo</a>
  </nav>

  <h2>Quản lý Nhiệm vụ Bổ sung Hàng</h2>

  <button class="ai-btn" onclick="runRestockAI()">⚡ Chạy Restock Priority AI</button>
  <p id="loading" class="loading-status">🤖 AI đang phân tích giờ cao điểm & tồn kho...</p>

  <div id="task-list"></div>

  <script src="data.js"></script>
  <script>
    function renderTasks() {
      const tasks = getItems('restockTasks');
      const container = document.getElementById('task-list');
      container.innerHTML = tasks.map(t => `
        <div class="task-item">
          <h4>Kệ: ${t.shelfId} — Mức ưu tiên: Số ${t.priority}</h4>
          <p>Trạng thái: <b>${t.status}</b></p>
          <p><i>Lý do AI: ${t.reason || 'Chưa phân tích'}</i></p>
          ${t.status !== 'Hoàn tất' ? `
            <button onclick="changeStatus('${t.id}', 'Đang xử lý')">Đang xử lý</button>
            <button onclick="changeStatus('${t.id}', 'Hoàn tất')">Hoàn tất</button>
          ` : '<span style="color:green; font-weight:bold;">✓ Đã hoàn thành</span>'}
        </div>
      `).join('');
    }

    function changeStatus(id, newStatus) {
      updateItem('restockTasks', id, { status: newStatus });
      renderTasks();
    }

    function runRestockAI() {
      document.getElementById('loading').style.display = 'block';
      setTimeout(() => {
        let tasks = getItems('restockTasks');
        tasks.sort((a, b) => a.priority - b.priority);
        if (tasks.length > 0) {
          tasks[0].reason = 'AI Cảnh báo: Kệ thuộc giờ cao điểm & tồn kho < 15%';
        }
        localStorage.setItem('restockTasks', JSON.stringify(tasks));
        document.getElementById('loading').style.display = 'none';
        renderTasks();
        alert('AI đã cập nhật thứ tự ưu tiên bơm hàng!');
      }, 1200);
    }

    renderTasks();
  </script>
</body>
</html>
